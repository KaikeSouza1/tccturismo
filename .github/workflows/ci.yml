name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # src/config/env.ts falha rapido na subida se faltar variavel obrigatoria
    # (ver backend/README.md) — os testes nunca abrem conexao real com banco
    # ou R2, mas o modulo e importado transitivamente, entao precisa de
    # valores (mesmo que falsos) so pra passar da validacao.
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ci_test
      JWT_SECRET: ci-test-secret
      R2_ACCOUNT_ID: ci-test
      R2_ACCESS_KEY_ID: ci-test
      R2_SECRET_ACCESS_KEY: ci-test
      R2_BUCKET_NAME: ci-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      # admin ainda nao tem testes automatizados (so backend e mobile) —
      # quando tiver, adicionar "npm test" aqui tambem.
